<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e90ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#20c997;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rotated by 55 degrees around center (55, 80) -->
  <g transform="rotate(55 80 80)">
    <!-- Leaf shape -->
    <path d="M 80 0 Q 120 40 120 80 Q 120 130 80 160 Q 40 130 40 80 Q 40 40 80 0 Z" 
          fill="url(#leafGradient)" 
          stroke="none"/>

    <!-- Leaf vein detail -->
    <line x1="80" y1="0" x2="80" y2="160" 
          stroke="#ffffff" 
          stroke-width="2.5" 
          opacity="0.3"/>

    <!-- Subtle vein curves -->
    <path d="M 65 30 Q 50 60 55 100" 
          stroke="#ffffff" 
          stroke-width="2" 
          fill="none" 
          opacity="0.2"/>
    <path d="M 95 30 Q 110 60 105 100" 
          stroke="#ffffff" 
          stroke-width="1.5" 
          fill="none" 
          opacity="0.2"/>
  </g>
</svg>