<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="420" height="120">
  <defs>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e90ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d7bb5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#20c997;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- HealthyBody text with gradient -->
  <text x="200" y="85" 
        font-family="'Segoe UI', 'Helvetica Neue', sans-serif" 
        font-size="72" 
        font-weight="600" 
        text-anchor="middle" 
        fill="url(#textGradient)" 
        letter-spacing="-1">HealthyBody</text>
  
  <!-- Optional subtle shadow effect -->
  <text x="200" y="85" 
        font-family="'Segoe UI', 'Helvetica Neue', sans-serif" 
        font-size="72" 
        font-weight="600" 
        text-anchor="middle" 
        fill="#1e90ff" 
        opacity="0.3" 
        filter="blur(2px)" 
        letter-spacing="-1">HealthyBody</text>
</svg>